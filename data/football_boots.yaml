# dealScout — football boot tier catalogue.
#
# WHY THIS EXISTS
# The engine used to decide "is this the flagship?" by looking for the word "elite" in the
# title. That is wrong in both directions. `Diadora Maximus Elite Academy FG` (RRP €70) is
# an Academy boot whose *range* is called "Maximus Elite". `Mizuno Morelia II Elite` is
# Mizuno's SECOND tier — their flagship is "Made in Japan". Puma's flagship is "Ultimate";
# a Puma boot saying "Elite" is not the top line. And a junior Elite (€120–140) is a
# genuinely different boot from an adult Elite (€250–295) — different upper, softer plate,
# wider last — not the same boot in small sizes.
#
# WHAT IT IS FOR
# Classification, NOT filtering. The owner is buying for a child, so a junior flagship is
# exactly what he might want. The catalogue's job is to let the email say *which* of these
# he is being offered, so a €130 junior boot can never be mistaken for a €280 adult one.
# "unknown" is a real answer here and must stay one.
#
# STALENESS
# `generation.status` is a snapshot: it says which boots were current in the season named
# by `last_verified`. It WILL rot — a "current" generation becomes "superseded" the moment
# its successor ships, with no code change and no error. When a status looks wrong, check
# this date before suspecting the parser. Refresh the statuses, bump the date.
last_verified: "2026-08"
category: football_boots
source: >-
  Nike & adidas football boot taxonomy research (Aug 2026): Footy Headlines naming-system
  articles, Pro:Direct boot-tier guides, Unisport, Fútbol Emotion and brand product pages.

# --- Title normalisation, applied before anything is matched -------------------------
#
# Junior markers. These decide adult-flagship vs junior-flagship and nothing else: a
# junior boot is not a lesser tier, it is a different construction at the top of its own
# range.
#
# PLURALS ARE LISTED SEPARATELY AND MUST STAY THAT WAY. Tokens match on a word boundary
# (`_token`), so `junior` does NOT match "Juniors" — the trailing "s" defeats it. That is
# not academic: sportsdirect.lv puts the audience LAST and in the plural, and every one of
# these was being read as an ADULT flagship until 2026-08-28 —
#   "Predator Elite Juniors Firm Ground Football Boots"          €61.20
#   "Predator Elite Laceless Juniors Firm Ground Football Boots" €63.00
#   "Predator Accuracy Injection+ Childrens Elite FG Boots"      €60.00
# which is the exact error this catalogue exists to prevent: a €60 junior boot presented
# as though it were a €280 adult one.
junior_markers:
  [kids, kid, junior, juniors, jr, j, youth, youths, "(gs)", "(ps)", "(td)",
   children, childrens, child, boys, girls, infant, infants]

# --- Retailer title rewrites, applied at the end of normalisation ---------------------
#
# Retailers do not all write a boot's name the way the brand does. Each rule here repairs
# a way of writing it that silently cost this tool a real find; all were measured on
# sportsdirect.lv — the owner's main shop — on 2026-08-28. Applied in order.
title_rewrites:
  # SportsDirect truncates long names to a fixed width: "Predator Elite" becomes
  # "Pred Elt", "Copa Pure 3 Elite" becomes "CopaP3Elt". Unexpanded these carry no tier
  # word at all and classify as `unknown`, which `require_stated: [tier]` then rejects —
  # so the owner's main shop silently drops its own cheapest genuine Elite boots.
  # Measured: "Unisex Kids CopaP3Elt Soft Ground Football Boots", €70.20.
  - {pattern: 'copap(\d)elt', replace: 'copa pure \1 elite'}
  - {pattern: '\bpred\s+elt\b', replace: 'predator elite'}
  - {pattern: '\belt\b', replace: 'elite'}
  # SportsDirect renders Nike's "SG-Pro"/"AG-Pro" SOLEPLATE with the ground spelled out in
  # words, which orphans the "Pro": "Superfly 10 Elite SG-Pro" is listed as "Kids' Superfly
  # 10 Elite Pro Soft Ground Football Boot". `soleplate_suffixes` cannot catch it, because
  # the "SG" it needs to anchor on is gone. Left alone the stray "Pro" falls LATER than
  # "Elite", so the later-word-wins rule demotes a genuine €96 junior Elite to a takedown.
  #
  # The spelled-out ground is REQUIRED, and only the two grounds whose Nike soleplate is
  # actually named "-Pro" (soft ground = SG-Pro, artificial = AG-Pro) count. Without that
  # guard the rule eats a real one: Diadora's "B-Elite Pro FG" is a genuine Pro takedown
  # whose range is called "B-Elite", and rewriting it promoted a €70 boot to a flagship.
  # "Elite Pro" is only ever a soleplate when the ground it names is standing right there.
  - {pattern: '\belite\s+pro\b(?=\s+(?:soft\s+ground|artificial|astro))', replace: 'elite'}

# Soleplate suffixes are stripped BEFORE tier keywords are read, or "SG-Pro" and "AG-Pro"
# are read as the Pro tier and every soft-ground flagship is demoted. Longest first, so
# "sg-pro" is consumed before a bare "sg" can take half of it.
#
# NOTE the absence of "in" (indoor). Stripping it protected nothing — no tier word hides
# inside it — and it silently ate the middle of Mizuno's "Made in Japan", turning their
# actual flagship into a takedown. Soleplates are read by the vocabulary, not here; this
# list exists only to stop them being mistaken for tier words.
soleplate_suffixes:
  [sg-pro, sg pro, ag-pro, ag pro, fg, sg, ag, mg, tf, ic, hg]

# Words that look like tier signals and are not: colourways, packs, technology badges and
# construction variants. Stripped before tier keywords are read. `nn` (Next Nature) and
# `se` (Special Edition) are the dangerous ones — both sit at the same tier.
noise:
  [se, nn, zm, air zoom, ft, ll, laceless, knitted, tongue, made in italy,
   blueprint, pure victory, chaos vs control, attack pack, break em]

# Retailers write the same generation in Roman or Arabic. Folded to Arabic before any
# generation is matched, so "Superfly XI" and "Superfly 11" are one boot.
roman_numerals:
  {i: 1, ii: 2, iii: 3, iv: 4, v: 5, vi: 6, vii: 7, viii: 8, ix: 9, x: 10,
   xi: 11, xii: 12, xiii: 13, xiv: 14, xv: 15, xvi: 16, xvii: 17}

# --- Brands ---------------------------------------------------------------------------
#
# `flagship` and `takedown` are the tier words THIS brand uses. When both appear, the one
# that appears LATER in the title is the real tier: for Nike and adidas "Elite" occupies
# the tier position, but Diadora embeds it in the range name ("Maximus Elite Academy") and
# Mizuno qualifies it upward ("Morelia II Elite Made in Japan"). Order settles both without
# a brand-specific branch.
#
# `rrp_bands` are corroboration only, never a gate — a discounted flagship is precisely
# what this tool exists to find, so price must not decide tier.
brands:
  nike:
    flagship: [elite]
    takedown: [pro, academy, club, league, match, play, essential]
    # Nike's CURRENT Elite is effectively adult-only, and the adult range starts small:
    # measured 2026-08-28 on prodirectsport.ie, 116 adult Nike Elites span EU 35-49 at RRP
    # €250-300. So a listing saying both "Kids" and "Elite" is usually the adult flagship
    # in a small size, shelved under Kids because EU 36-39 fits a child — sportsdirect.lv
    # lists "Kids' Superfly 10 Elite SG", EU 36-39, reference price €317.99, which is the
    # adult RRP.
    #
    # This is deliberately NOT encoded as "Nike makes no junior Elite". That claim traces
    # to Nike's kids' fit guide, which could not be fetched directly to confirm — and the
    # same measurement argues against it as a blanket rule: 11 junior-marked Nike Elites
    # (Superfly VI/VII, Phantom VSN/VNM, Hypervenom III) sit at RRP €150-175, far below
    # the adult boots of their own era, which is what a genuine junior product looks like.
    # Those are clearance-shelf boots, exactly what this tool hunts, and a blanket rule
    # would relabel every one of them. The discrimination is done per listing by RRP
    # instead (`_priced_as_adult`), which needs no claim about what Nike does or does not
    # manufacture.
    rrp_bands:
      # RRP from `compare_at_price`, never a selling price — an earlier pass read the sale
      # price and put the adult floor at €210 because a Tiempo was discounted to that. A
      # band built from sale prices drifts down with every sale.
      adult-flagship: [250, 320]
      junior-flagship: [110, 175]
      takedown: [40, 190]
    lines:
      mercurial superfly:
        patterns: [mercurial superfly, superfly]
        generations:
          - gen: 11
            patterns: [superfly 11]
            year: 2026
            launch_rrp_eur: 295
            status: current
          - gen: 10
            patterns: [superfly 10]
            year: 2024
            launch_rrp_eur: 310
            status: superseded
            note: "Highest-ever Nike Elite RRP; a genuine one at €150-180 is ~50% off"
          - gen: 9
            patterns: [superfly 9]
            year: 2022
            launch_rrp_eur: 290
            status: discontinued
      mercurial vapor:
        patterns: [mercurial vapor, vapor]
        generations:
          - gen: 17
            patterns: [vapor 17]
            year: 2026
            launch_rrp_eur: 260
            status: current
          - gen: 16
            patterns: [vapor 16]
            year: 2024
            launch_rrp_eur: 310
            status: superseded
          - gen: 15
            patterns: [vapor 15]
            year: 2022
            launch_rrp_eur: 275
            status: discontinued
      phantom:
        patterns: [phantom]
        generations:
          - gen: 6
            patterns: [phantom 6]
            year: 2025
            launch_rrp_eur: 265
            status: current
          - gen: 2
            patterns: [phantom gx 2, phantom gx2]
            year: 2024
            launch_rrp_eur: 290
            status: superseded
          - gen: 1
            patterns: [phantom gx]
            year: 2023
            launch_rrp_eur: 290
            status: discontinued
          - patterns: [phantom gt2, phantom gt 2]
            year: 2022
            launch_rrp_eur: 280
            status: discontinued
          - patterns: [phantom gt]
            year: 2021
            launch_rrp_eur: 280
            status: discontinued
      tiempo:
        patterns: [tiempo maestro, tiempo legend, tiempo]
        generations:
          - patterns: [tiempo maestro, maestro]
            year: 2026
            launch_rrp_eur: 240
            status: current
            note: "'Maestro' replaces the 'Legend' name from 2026"
          - gen: 10
            patterns: [legend 10]
            year: 2023
            launch_rrp_eur: 240
            status: superseded
          - gen: 9
            patterns: [legend 9]
            year: 2021
            launch_rrp_eur: 225
            status: discontinued
          - gen: 8
            patterns: [legend 8]
            year: 2019
            launch_rrp_eur: 210
            status: discontinued
          - gen: 7
            patterns: [legend 7]
            year: 2018
            launch_rrp_eur: 230
            status: discontinued
            note: "Still listed by clearance retailers; eight years old"

  adidas:
    flagship: [elite]
    # Pre-July-2024 adidas marked the top tier with "+" rather than "Elite":
    # Predator+, Copa Pure+, X Crazyfast+. Still on clearance shelves.
    flagship_patterns: ['predator\s*\+', 'copa\s+pure\s*\+', 'x\s+crazyfast\s*\+',
                        'x\s+speedportal\s*\+', 'crazyfast\s*\+']
    # THE NUMBERED ERA (~2018 – mid-2024), and the thing most often got wrong about adidas.
    #
    # Before the Elite/Pro/League/Club names, adidas marked the tier with a NUMBER:
    # Predator 20.1, X Ghosted.1, Copa Sense.1, Nemeziz 19.4. The ladder was:
    #
    #     Predator+   (laceless)  -> Elite      "+" beat ".1", despite the 1
    #     Predator.1  (laced)     -> Elite      SAME tier as "+", not below it
    #     Predator.2              -> Pro
    #     Predator.3              -> League
    #     Predator.4              -> Club
    #
    # adidas replaced it in Jan 2024 (fully by July 2024) with names deliberately aligned
    # to Nike's — Elite / Pro / League / Club against Elite / Pro / Academy / Club — for
    # the stated reason that "+" vs ".1" had led people to think one outranked the other.
    # That retired system is why an adidas boot is sometimes described as having numbered
    # Elite tiers. It does not: today "Elite" is one tier, and it is the top one, exactly
    # level with Nike Elite. "Elite LL" / "Elite FT" / "Elite Knitted" are CLOSURE
    # variants at that same tier, not a ranking, and are handled by `noise`.
    #
    # Read against the RAW title, because the DOT is the entire signal and `normalise`
    # turns it into a space. Without the dot "Copa Pure 3" — a GENERATION, and a current
    # one — is indistinguishable from ".3", a League takedown. Misreading it that way
    # would argue the owner out of exactly the boot this tool hunts, so the dot is required.
    legacy_numbered:
      flagship: ['(?<=[a-z0-9])\.1(?![0-9])']
      takedown: ['(?<=[a-z0-9])\.[234](?![0-9])']
    takedown: [pro, league, club, academy, match, play, essential]
    rrp_bands:
      # RRP, read from `compare_at_price` — never from today's selling price. Measured
      # 2026-08-28 across 84 adult and 34 junior adidas Elites on prodirectsport.ie, and
      # corroborated against adidas.co.uk's own kids Predator Elite pages (£110-120).
      #
      # The adult floor is €240, not 250: Copa is adidas's cheapest flagship silo (Copa
      # Pure III/IV Elite FG, AG and SG all list at €240), and a band starting at 250
      # excluded every Copa there is.
      #
      # UNLIKE NIKE, adidas really does make a junior Elite — Predator/F50/Copa Elite Kids
      # exist as their own products, EU 28-39.5, RRP €110-150. They are genuinely
      # de-specced against the adult boot (TPU plate rather than the carbon POWERSPINE, no
      # Strikeskin fins, laced only), which is why an adidas junior Elite and a Nike Elite
      # are not the same class of boot even though both say "Elite". That asymmetry is the
      # single most useful thing this file knows for a buyer at EU 37.
      adult-flagship: [240, 350]
      junior-flagship: [110, 150]
      takedown: [40, 180]
    lines:
      predator:
        patterns: [predator]
        generations:
          - gen: 26
            patterns: [predator 26, wales bonner]
            year: 2026
            launch_rrp_eur: 280
            status: current
            note: "Wales Bonner collab lists at €320-350 — a genuine Elite, priced up"
          - gen: 25
            patterns: [predator 25]
            year: 2025
            launch_rrp_eur: 280
            status: superseded
          - gen: 24
            patterns: [predator 24]
            year: 2024
            launch_rrp_eur: 280
            status: superseded
          - patterns: [predator accuracy]
            year: 2023
            launch_rrp_eur: 270
            status: discontinued
          - patterns: [predator edge]
            year: 2022
            launch_rrp_eur: 265
            status: discontinued
      f50:
        patterns: [f50, x crazyfast, x speedportal]
        generations:
          - patterns: [f50]
            year: 2024
            launch_rrp_eur: 270
            status: current
            note: "Relaunch of the F50 name after a nine-year gap"
          - patterns: [x crazyfast, crazyfast]
            year: 2023
            launch_rrp_eur: 265
            status: discontinued
          - patterns: [x speedportal, speedportal]
            year: 2022
            launch_rrp_eur: 260
            status: discontinued
      # Deliberately outside the Elite/Pro/League/Club ladder: kangaroo leather, made in
      # Germany, ~€140, perennial. Listed BEFORE `copa` so the more specific name wins —
      # `copa`'s own patterns would otherwise claim it.
      copa mundial:
        patterns: [copa mundial]
        generations:
          - patterns: [copa mundial]
            year: 1979
            launch_rrp_eur: 140
            status: evergreen
      copa:
        patterns: [copa pure, copa]
        generations:
          # Copa Pure 4 launched Jan 2026 ("Born For Goals"), so the 3 is now superseded.
          # Measured 2026-08-28 on komanda.lv, adidas's own Baltic dealer: Copa Pure IV
          # Elite FG and SG both €240 across a full 39–44 grid, while the Copa Pure 2
          # Elite is down to a single size at €184 — a current boot and a clearing one.
          # Reported to be the LAST Copa: adidas is bringing the Adipure name back for
          # 2027, at which point this line needs a new entry rather than another number.
          - gen: 4
            patterns: [copa pure 4]
            year: 2026
            launch_rrp_eur: 240
            status: current
          - gen: 3
            patterns: [copa pure 3]
            year: 2024
            launch_rrp_eur: 250
            status: superseded
          - gen: 2
            patterns: [copa pure 2]
            year: 2024
            launch_rrp_eur: 255
            status: superseded
          - patterns: [copa pure]
            year: 2022
            launch_rrp_eur: 250
            status: discontinued

  puma:
    # Puma's top line is "Ultimate". "Elite" is not a Puma tier word at all, so a Puma
    # boot advertising Elite tells us nothing and must classify as unknown.
    flagship: [ultimate]
    takedown: [match, play, pro]
    rrp_bands:
      adult-flagship: [200, 240]
      junior-flagship: [90, 130]
      takedown: [40, 150]
    lines:
      future:
        patterns: [future]
        generations: []
      ultra:
        patterns: [ultra]
        generations: []
      king:
        patterns: [king]
        generations: []

  mizuno:
    # "Made in Japan" sits ABOVE "Elite" for Mizuno. Morelia II Elite is their second
    # tier at roughly €150-180, so `elite` belongs in `takedown` here — the same word
    # meaning a different thing is exactly what a per-brand table is for.
    flagship: [made in japan, japan kl, mij]
    takedown: [elite, pro, club]
    rrp_bands:
      adult-flagship: [290, 350]
      junior-flagship: [90, 140]
      takedown: [80, 200]
    lines:
      morelia:
        patterns: [morelia neo, morelia]
        generations: []
      alpha:
        patterns: [alpha]
        generations: []

  diadora:
    # Diadora embeds "Elite" in the RANGE name — "Maximus Elite", "B-Elite" — and puts the
    # real tier word after it. Handled by the later-word-wins rule, not by a special case.
    flagship: [elite]
    takedown: [academy, pro, league, club, play]
    rrp_bands:
      adult-flagship: [200, 280]
      junior-flagship: [90, 150]
      takedown: [50, 100]
    lines:
      maximus:
        patterns: [maximus]
        generations: []
      brasil:
        patterns: [brasil, b-elite]
        generations: []

  new balance:
    flagship: [elite]
    takedown: [pro, dispatch, magia, magnia]
    rrp_bands:
      adult-flagship: [200, 250]
      junior-flagship: [80, 130]
      takedown: [50, 160]
    lines:
      furon:
        patterns: [furon]
        generations: []
      tekela:
        patterns: [tekela]
        generations: []

  # Brands whose naming is model-based rather than tier-based. Listing them with NO
  # flagship word is deliberate: "Umbro Medusae Elite" must come back `unknown` rather
  # than borrow Nike's meaning of the word. Silence beats a confident guess.
  lotto:
    flagship: []
    takedown: []
    lines: {}
  umbro:
    flagship: []
    takedown: []
    lines: {}
  joma:
    flagship: []
    takedown: []
    lines: {}
