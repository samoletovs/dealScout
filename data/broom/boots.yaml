# bRoom boot dataset — per-generation site facts, joined to the classifier.
#
# READ data/broom/README.md FIRST. The short version:
#
#   * This file carries the fields the public site needs and the classifier does not:
#     audience, measured street price, upper tech + plain explanation, plate material,
#     weight, soleplate variants sold, signature players, colourway packs, retailer URL.
#   * It does NOT carry launch RRP, model year, or generation status. Those live in
#     data/football_boots.yaml and are joined on (brand, silo, generation). Storing them
#     here too would let the two files drift within a season — the rot this project fights.
#   * Every factual field cites a source URL, or is the literal string UNVERIFIED.
#     street_price_eur is a MEASURED selling price, never an RRP.
#
# The join key is (brand, silo, generation). `silo` matches a line key under a brand in
# football_boots.yaml (e.g. "mercurial superfly", "copa"); `generation` matches a
# generation's `gen:` there, or its first pattern when it has no number (e.g. "maestro",
# "phantom gx"). tests/test_broom_dataset.py fails the build if a key here is absent there.
#
# WHY LAUNCH RRP SOMETIMES DIFFERS FROM WHAT REVIEWS SAY. Reviews and US retailers quote
# USD MSRPs and regional EUR launch prices that vary by country and VAT; they disagree by
# €10–20 routinely (a search put Superfly 11 at "€300–315" while the catalogue's measured
# EU launch RRP is €295). The catalogue's launch_rrp_eur is the number this project stands
# behind; disagreements are recorded in `rrp_note` here rather than overwriting it.

last_verified: "2026-08"
category: broom_boots
source_note: >-
  Per-generation facts for bRoom. Launch RRP, model year and generation status are NOT in
  this file — they are owned by data/football_boots.yaml and joined on
  (brand, silo, generation). street_price_eur is a measured selling price with its own
  source, never an RRP. Sourced Aug 2026 from Footy Headlines, Unisport, Pro:Direct,
  Fútbol Emotion, SoccerBible, brand product pages, and named specialist reviews.

