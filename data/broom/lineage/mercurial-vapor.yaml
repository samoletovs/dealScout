  - brand: nike
    silo: mercurial vapor
    sequence: 10
    name: Mercurial Vapor VIII
    year: 2012
    photo: UNVERIFIED
    innovation: >-
      The generation that added grip to the speed. Its upper was covered in a fine speckled
      texture, and it was one of the first Nike boots with ACC — "All Conditions Control" — a
      surface treatment meant to keep the same grip on the ball whether the pitch was dry or
      soaking. A hugely popular boot of its era and, for many players who grew up in the
      2010s, the definitive Mercurial.
    why: >-
      Up to here the Vapor sold itself purely on being light. This one answered the obvious
      complaint about a thin, slick synthetic — that a wet ball slid off it — without adding
      the weight back.
    players: UNVERIFIED
    sources:
      - https://en.wikipedia.org/wiki/Nike_Mercurial
      - https://www.prodirectsport.com/blogs/football/nike-mercurial-history

