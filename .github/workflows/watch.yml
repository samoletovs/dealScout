name: dealScout watch

# Manual only. This ran daily for months against the shipped example config, whose single
# watch item is the literal placeholder `https://www.example.com/product/123` — so every
# run fetched a 404, wrote an empty report and reported success. The owner's real watch
# list lives in `config.local.yaml`, which is private and not in CI, so a scheduled run
# here cannot do anything useful. Restore the schedule the day CI has a config worth
# running: the entrypoint now exits non-zero when nothing could be read, so a broken
# watch list will announce itself instead of passing quietly.

on:
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m dealscout.run
        env:
          COURIER_URL: ${{ secrets.COURIER_URL }}
          COURIER_KEY: ${{ secrets.COURIER_KEY }}
          DEALSCOUT_EMAIL_TO: ${{ secrets.DEALSCOUT_EMAIL_TO }}
