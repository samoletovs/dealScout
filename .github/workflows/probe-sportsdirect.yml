name: probe sportsdirect (temporary)

# TEMPORARY measurement. Delete once the answer is recorded in SOURCES.md.
# Round 3 settled reachability: an honest self-identifying UA is served, HTTP 200, 812 KB.
# Round 4 asks the next question — once the bytes arrive, how many PRODUCTS do this repo's
# own parsers actually recover from them? SOURCES.md claims "the parser is not the
# problem", but nothing in the tree reads the `ecommerceData` block, so that needs testing
# rather than believing. Also saves the page as an artifact to build a fixture from.

on:
  push:
    branches: [samoletovs-sportsdirect-source-adidas-tiers]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt

      - name: What do our parsers recover?
        run: python probe_sportsdirect.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sportsdirect-page
          path: page.html
          if-no-files-found: ignore
