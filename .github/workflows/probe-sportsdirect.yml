name: probe sportsdirect (temporary)

# TEMPORARY measurement. Delete once the answer is recorded in SOURCES.md.
# Round 3 settled reachability: an honest self-identifying UA is served, HTTP 200, 812 KB.
# Round 4 asks the next question — once the bytes arrive, how many PRODUCTS do this repo's
# own parsers actually recover from them? SOURCES.md claims "the parser is not the
# problem", but nothing in the tree reads the `ecommerceData` block, so that needs testing
# rather than believing. Also saves the page as an artifact to build a fixture from.

on:
  push:
    branches: [samoletovs-sportsdirect-source-adidas-tiers]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt

      - name: What do our parsers recover?
        run: |
          python - <<'PY'
          import asyncio, re, pathlib
          from dealscout import collector

          URL = "https://www.sportsdirect.lv/football/football-boots/kids-football-boots"

          async def main():
              html = await collector.fetch(URL, timeout=40)
              if not html:
                  print("FETCH FAILED"); return
              print(f"fetched {len(html)} bytes")
              pathlib.Path("page.html").write_text(html, encoding="utf-8")

              print("\n--- parse_html_links ---")
              links = collector.parse_html_links(html, URL)
              print(f"  {len(links)} links")
              for n, u in links[:8]:
                  print(f"   * {n!r} -> {u[:90]}")

              print("\n--- parse_product_tiles ---")
              tiles = collector.parse_product_tiles(html, URL)
              print(f"  {len(tiles)} tiles")
              for p in tiles[:8]:
                  print(f"   * {p.name!r} {p.price} {p.brand!r}")

              print("\n--- parse_ldjson_products ---")
              lds = collector.parse_ldjson_products(html, URL)
              print(f"  {len(lds)} ld+json products")

              print("\n--- raw ecommerceData impressions (what IS in the page) ---")
              m = re.search(r"var ecommerceData\s*=\s*(\{.*?\});", html, re.S)
              print(f"  block present: {bool(m)}")
              if m:
                  print(f"  impressions: {len(re.findall(r'\"id\":\"', m.group(1)))}")

          asyncio.run(main())
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sportsdirect-page
          path: page.html
          if-no-files-found: ignore
