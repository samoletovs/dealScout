  - id: zara-tee-belowtier-reject
    note: "Zara is below basket tier — reject"
    product:
      title: "Zara cotton tee"
      category: tee
      brand: Zara
      price: 10
      reference_price: 30
      currency: EUR
      url: "https://example.com/zara-tee"
      materials: { cotton: 1.0 }
      care: "machine wash"
    expected: { band: reject }

  # ===========================================================================
  # HUNT CASES — scored by `judge_hunt` against the `boots-junior` hunt as it is
  # actually configured, not by the wardrobe judge. Adding `hunt:` is what routes
  # them; without it they would be scored by `judge`, which has no concept of tier
  # and would pass or fail them for unrelated reasons.
  #
  # `expected.attrs` pins the attributes the verdict was built from. Band alone is
  # not enough here: several of these are rejected today, and a case that only
  # asserts `band: reject` cannot tell a rejection for the right reason from one
  # that happened for another. Pinning the attribute is what gives the case teeth.
  #
  # These are all cases the engine gets RIGHT today. They exist to stop the tier
  # catalogue regressing them. The known-wrong cases (Diadora "Elite Academy",
  # superseded generations) land with the catalogue that fixes them.
  # ===========================================================================

  - id: boots-nike-superfly-elite-mustbuy
    note: "Genuine junior Elite, in a wanted size, under the must-buy price"
    hunt: boots-junior
    product:
      title: "Nike Jr. Mercurial Superfly 10 Elite AG"
      category: football_boots
      brand: Nike
      price: 65
      reference_price: 130
      currency: EUR
      url: "https://example.com/nike-superfly-10-elite-jr"
      source: komanda.lv
      sizes: ["@wanted"]
      sizes_known: true
    expected:
      band: must-buy
      attrs: { tier: junior-flagship, soleplate: AG, silo: mercurial superfly, generation_status: superseded }

  - id: boots-adidas-predator-elite-good
    note: "adidas Elite at 37 1/3 — priced into the good band, not must-buy"
    hunt: boots-junior
    product:
      title: "adidas Predator Elite FG"
      category: football_boots
      brand: adidas
      price: 95
      reference_price: 130
      currency: EUR
      url: "https://example.com/adidas-predator-elite-fg"
      source: komanda.lv
      sizes: ["@wanted"]
      sizes_known: true
    expected:
      band: good
      attrs: { tier: junior-flagship, soleplate: FG, silo: predator }

  - id: boots-academy-takedown-reject
    note: "Academy is a takedown of the same silo — rejected on tier, not on price"
    hunt: boots-junior
    product:
      title: "Nike Jr. Mercurial Vapor 16 Academy FG"
      category: football_boots
      brand: Nike
      price: 60
      reference_price: 90
      currency: EUR
      url: "https://example.com/nike-vapor-16-academy-jr"
      source: komanda.lv
      sizes: ["@wanted"]
      sizes_known: true
    expected:
      band: reject
      attrs: { tier: takedown, soleplate: FG }

  - id: boots-unknown-brand-reject
    note: "A 67%-off boot from a brand the hunt does not want is not a cheap Nike"
    hunt: boots-junior
    product:
      title: "Skechers Razor Elite FG"
      category: football_boots
      brand: Skechers
      price: 40
      reference_price: 120
      currency: EUR
      url: "https://example.com/skechers-razor-elite"
      source: example.com
      sizes: ["@wanted"]
      sizes_known: true
    expected: { band: reject }

  - id: boots-size-sold-out-reject
    note: "The shop stated its sizes and ours is not among them — answered, and the answer is no"
    hunt: boots-junior
    product:
      title: "Nike Jr. Mercurial Superfly 10 Elite FG"
      category: football_boots
      brand: Nike
      price: 65
      reference_price: 130
      currency: EUR
      url: "https://example.com/nike-superfly-10-elite-jr-sold-out"
      source: komanda.lv
      sizes: ["@unwanted"]
      sizes_known: true
    expected:
      band: reject
      attrs: { tier: junior-flagship, soleplate: FG }

  - id: boots-used-condition-reject
    note: "Second-hand is out of scope regardless of price"
    hunt: boots-junior
    product:
      title: "Nike Jr. Mercurial Superfly 10 Elite AG"
      category: football_boots
      brand: Nike
      price: 45
      reference_price: 130
      currency: EUR
      url: "https://example.com/nike-superfly-10-elite-jr-used"
      source: example.com
      condition: used
      sizes: ["@wanted"]
      sizes_known: true
    expected: { band: reject }

  - id: boots-tier-unstated-reject
    note: >-
      No tier word in the title. `require_stated: [tier]` rejects rather than flags,
      because no amount of clicking will make a title state a tier it omits.
    hunt: boots-junior
    product:
      title: "Nike Jr. Phantom GX FG"
      category: football_boots
      brand: Nike
      price: 65
      reference_price: 130
      currency: EUR
      url: "https://example.com/nike-phantom-gx-jr"
      source: komanda.lv
      sizes: ["@wanted"]
      sizes_known: true
    expected:
      band: reject
      attrs: { soleplate: FG, silo: phantom }

  # ===========================================================================
  # TIER CATALOGUE — the false friends the substring matcher could not tell apart.
  #
  # Every one of these titles contains the word "Elite". Before the catalogue the
  # engine read all of them as the flagship tier. Note how few of them move their
  # BAND: most are rejected on brand or on price either way, so a case asserting
  # only `band: reject` would pass identically before and after and prove nothing.
  # The pinned `attrs.tier` is the assertion that actually has teeth here.
  # ===========================================================================

  - id: boots-diadora-elite-academy-is-a-takedown
    note: >-
      "Maximus Elite" is the RANGE name and "Academy" is the tier — an entry-level
      boot at RRP €70 whose title contains the flagship word. Rejected on brand
      either way, so only the pinned tier shows the catalogue working.
    hunt: boots-junior
    product:
      title: "Diadora Maximus Elite Academy FG"
      category: football_boots
      brand: Diadora
      price: 30
      reference_price: 70
      currency: EUR
      url: "https://example.com/diadora-maximus-elite-academy"
      source: example.com
      sizes: ["@wanted"]
      sizes_known: true
    expected:
      band: reject
      attrs: { tier: takedown, silo: maximus }

  - id: boots-diadora-b-elite-pro-is-a-takedown
    note: "'B-Elite' is the silo, 'Pro' is the tier. Same trap, different range."
    hunt: boots-junior
    product:
      title: "Diadora Kids B-Elite Pro FG"
      category: football_boots
      brand: Diadora
      price: 35
      reference_price: 75
      currency: EUR
      url: "https://example.com/diadora-b-elite-pro"
      source: example.com
      sizes: ["@wanted"]
      sizes_known: true
    expected:
      band: reject
      attrs: { tier: takedown, silo: brasil }

  - id: boots-tiempo-legend-7-is-an-eight-year-old-junior-flagship
    note: >-
      The live misrepresentation. A 2018 boot, seven generations superseded, with no
      RRP published — so nothing but the catalogue can say how old it is. It is a
      genuine junior flagship and still surfaces, which is correct for a growing
      child; what changed is that the row can no longer be mistaken for current-season
      stock. Pinning generation_status is the whole point of the case.
    hunt: boots-junior
    product:
      title: "Nike Kids Tiempo Legend VII Elite FG"
      category: football_boots
      brand: Nike
      price: 55
      reference_price: null      # komanda.lv and other official dealers publish none
      currency: EUR
      url: "https://example.com/nike-tiempo-legend-7-elite-kids"
      source: komanda.lv
      sizes: ["@wanted"]
      sizes_known: true
    expected:
      band: must-buy
      attrs:
        tier: junior-flagship
        silo: tiempo
        generation: "7"
        generation_status: discontinued
        generation_year: "2018"

  - id: boots-junior-copa-pure-elite-no-longer-rejected-on-rrp
    note: >-
      The false negative pointing the other way. RRP €90 is genuinely the top of the
      junior range, and `min_reference_price: 110` used to reject it as "not a
      flagship". Now the tier is established from the title, so the price proxy for
      that same question no longer applies and the boot is surfaced.
      `generation_status` is incidental corroboration here rather than the point of the
      case — it moved from `current` to `superseded` on 2026-08-28, when the catalogue
      caught up with the Copa Pure 4 having shipped in January 2026.
    hunt: boots-junior
    product:
      title: "adidas Kids Copa Pure III Elite FG/MG"
      category: football_boots
      brand: adidas
      price: 45
      reference_price: 90
      currency: EUR
      url: "https://example.com/adidas-copa-pure-3-elite-kids"
      source: example.com
      sizes: ["@wanted"]
      sizes_known: true
    expected:
      band: must-buy
      attrs: { tier: junior-flagship, silo: copa, generation: "3", generation_status: superseded }

  - id: boots-wales-bonner-collab-is-a-real-flagship-priced-up
    note: >-
      €350 is correct for a designer collaboration, not a mislabel. Rejected here only
      because it is far over this hunt's ceiling — the tier reading is right.
    hunt: boots-junior
    product:
      title: "adidas Predator Elite Tongue x Wales Bonner FG"
      category: football_boots
      brand: adidas
      price: 350
      reference_price: 350
      currency: EUR
      url: "https://example.com/adidas-predator-elite-wales-bonner"
      source: example.com
      sizes: ["@wanted"]
      sizes_known: true
    expected:
      band: reject
      attrs: { tier: adult-flagship, silo: predator, generation: "26", generation_status: current }

  - id: boots-mizuno-made-in-japan-outranks-its-own-elite
    note: "'Made in Japan' sits ABOVE 'Elite' for Mizuno — the qualifier after it wins."
    hunt: boots-junior
    product:
      title: "Mizuno Morelia II Elite Made in Japan FG"
      category: football_boots
      brand: Mizuno
      price: 200
      reference_price: 350
      currency: EUR
      url: "https://example.com/mizuno-morelia-mij"
      source: example.com
      sizes: ["@wanted"]
      sizes_known: true
    expected:
      band: reject
      attrs: { tier: adult-flagship, silo: morelia }

  - id: boots-mizuno-elite-alone-is-second-tier
    note: >-
      The same word, the other way round. Without "Made in Japan" a Mizuno "Elite" is
      their SECOND tier at ~€150-180 — so `elite` is a takedown keyword for this brand
      and a flagship keyword for Nike, which is exactly why the table is per-brand.
    hunt: boots-junior
    product:
      title: "Mizuno Morelia II Elite FG"
      category: football_boots
      brand: Mizuno
      price: 90
      reference_price: 160
      currency: EUR
      url: "https://example.com/mizuno-morelia-elite"
      source: example.com
      sizes: ["@wanted"]
      sizes_known: true
    expected:
      band: reject
      attrs: { tier: takedown, silo: morelia }

  - id: boots-superfly-se-agpro-is-a-current-adult-flagship
    note: >-
      Two traps at once: "AG-Pro" is a soleplate, not the Pro tier, and "SE" is a
      colourway. Both must be stripped before the tier word is read. Roman "XI" folds
      to generation 11.
    hunt: boots-junior
    product:
      title: "Nike Mercurial Superfly XI Elite SE AG-Pro"
      category: football_boots
      brand: Nike
      price: 300
      reference_price: 300
      currency: EUR
      url: "https://example.com/nike-superfly-11-elite-se"
      source: example.com
      sizes: ["@wanted"]
      sizes_known: true
    expected:
      band: reject
      attrs:
        tier: adult-flagship
        silo: mercurial superfly
        generation: "11"
        generation_status: current

  - id: boots-puma-elite-is-not-a-puma-tier-word
    note: >-
      Puma's flagship is "Ultimate". "Elite" is not in their tier naming at all, so the
      honest reading is no tier — note the pinned silo proves the catalogue recognised
      the brand and the model line and still declined to name one, rather than simply
      failing to look.
    hunt: boots-junior
    product:
      title: "Puma Future 8 Elite FG"
      category: football_boots
      brand: Puma
      price: 60
      reference_price: 120
      currency: EUR
      url: "https://example.com/puma-future-8-elite"
      source: example.com
      sizes: ["@wanted"]
      sizes_known: true
    expected:
      band: reject
      attrs: { silo: future, soleplate: FG }

  - id: boots-generation-newer-than-the-catalogue
    note: >-
      Found in a live email: "Copa Pure IV Elite ... discontinued generation (2022)".
      The unnumbered `copa pure` entry is a prefix of every later name, so it answered
      for all of them and reported a boot newer than this file as three-year-old
      clearance. The tier is still read from the title and pinned here; only the
      generation claim is withdrawn. `generation_status` is absent from the pinned
      attributes on purpose — the point of the case is that no status is asserted.
      The boot moved on 2026-08-28: the Copa Pure IV that first exposed this shipped in
      January 2026 and is now the CURRENT generation in the catalogue, so it can no
      longer stand for a number the file has never seen. Copa Pure V does that now. The
      case is about an uncatalogued number, not about any particular boot.
    hunt: boots-junior
    product:
      title: "adidas Copa Pure V Elite FG Chaos vs Control Kids"
      category: football_boots
      brand: adidas
      price: 94
      reference_price: null
      currency: EUR
      url: "https://example.com/adidas-copa-pure-v-elite-kids"
      source: example.com
      sizes: ["@wanted"]
      sizes_known: true
    expected:
      band: good
      attrs: { tier: junior-flagship, soleplate: FG, silo: copa, generation_status: null, generation_year: null }

  - id: boots-current-copa-generation-is-the-fourth
    note: >-
      The other side of the change, and the one that rots silently: this file said Copa
      Pure 3 was "current" nine months after adidas shipped the 4. Measured 2026-08-28 on
      komanda.lv (adidas's Baltic dealer, which sells at RRP): Copa Pure IV Elite €240
      across a full 39-44 grid, Copa Pure 2 Elite down to one size at €184. Pinning the
      status is what makes the next generation's arrival a test failure rather than a
      quietly wrong email.
    hunt: boots-junior
    product:
      title: "adidas Copa Pure IV Elite FG Kids"
      category: football_boots
      brand: adidas
      price: 94
      reference_price: null
      currency: EUR
      url: "https://example.com/adidas-copa-pure-iv-elite-kids"
      source: example.com
      sizes: ["@wanted"]
      sizes_known: true
    expected:
      band: good
      attrs: { tier: junior-flagship, soleplate: FG, silo: copa, generation: "4", generation_status: current, generation_year: "2026" }

  # --- sportsdirect.lv, the owner's main shop (wired in 2026-08-28) -----------------
  #
  # Verbatim titles from www.sportsdirect.lv/football/football-boots/kids-football-boots.
  # Every one of these was judged WRONG until the shop was wired in and the ways it
  # writes a name were learned. They are the reason this file has a sportsdirect block.

  - id: boots-sportsdirect-plural-juniors-is-not-an-adult
    note: >-
      "Juniors", not "Junior". Tokens match on a word boundary, so the trailing "s"
      defeated the junior marker and this €61.20 junior boot was reported as an ADULT
      flagship — the one error the tier catalogue exists to prevent. The tier pin is the
      whole point of the case.
    hunt: boots-junior
    product:
      title: "Predator Elite Juniors Firm Ground Football Boots"
      category: football_boots
      brand: adidas
      price: 61.20
      reference_price: 260
      currency: EUR
      url: "https://example.com/sd-predator-elite-juniors"
      source: sportsdirect.lv
      sizes: ["@wanted"]
      sizes_known: true
    expected:
      band: must-buy
      attrs: { tier: junior-flagship, soleplate: FG, silo: predator }

  - id: boots-sportsdirect-orphaned-soleplate-pro
    note: >-
      SportsDirect spells the ground out in words, which strands the "Pro" of Nike's
      "SG-Pro" SOLEPLATE: "Superfly 10 Elite SG-Pro" is listed as "Elite Pro ... Soft
      Ground". The stray Pro fell later than "Elite", so later-word-wins demoted a
      genuine junior Elite to a takedown and `require_stated: [tier]` dropped it.
      Rejected here for SOLEPLATE (SG is not AG/FG), which is correct — the pin proves
      it is rejected for the ground and not for a tier it does have.
    hunt: boots-junior
    product:
      title: "Kids' Superfly 10 Elite Pro Soft Ground Football Boot"
      category: football_boots
      brand: Nike
      price: 96
      reference_price: 310
      currency: EUR
      url: "https://example.com/sd-superfly-10-elite-sg-pro"
      source: sportsdirect.lv
      sizes: ["@wanted"]
      sizes_known: true
    expected:
      band: reject
      attrs: { tier: junior-flagship, soleplate: SG }

  - id: boots-sportsdirect-truncated-name
    note: >-
      "CopaP3Elt" is Copa Pure 3 Elite, truncated to a fixed width. Unexpanded it carries
      no tier word at all, so it read `unknown` and was rejected every run — a genuine
      junior Elite at €70.20 on the owner's own shop, never once surfaced.
      Lands in `good`, not `must-buy`: €70.20 is twenty cents the wrong side of the
      `must_buy: 70` line, which is the threshold behaving exactly as configured.
    hunt: boots-junior
    product:
      title: "Unisex Kids CopaP3Elt Firm Ground Football Boots"
      category: football_boots
      brand: adidas
      price: 70.20
      reference_price: 250
      currency: EUR
      url: "https://example.com/sd-copa-pure-3-elite"
      source: sportsdirect.lv
      sizes: ["@wanted"]
      sizes_known: true
    expected:
      band: good
      attrs: { tier: junior-flagship, soleplate: FG, silo: copa }

  # --- adidas before it renamed its tiers (retired mid-2024) ------------------------
  #
  # Until 2024 adidas marked the tier with a NUMBER: Predator 20.1, X Ghosted.1. "+"
  # (laceless) and ".1" (laced) were the SAME top tier; ".2" was Pro, ".3" League, ".4"
  # Club. adidas renamed the lot to Elite/Pro/League/Club precisely because "+" versus
  # ".1" made people think one outranked the other. Clearance shelves are full of these
  # and every one of them read `unknown`, which `require_stated: [tier]` then rejected.

  - id: boots-adidas-legacy-dot-one-is-a-flagship
    note: >-
      The case behind the owner's question about "adidas Elite tiers". ".1" is a
      FLAGSHIP, level with "+" — not a second tier, and not a Nike Pro equivalent.
    hunt: boots-junior
    product:
      title: "adidas Kids Predator Accuracy.1 FG"
      category: football_boots
      brand: adidas
      price: 85
      reference_price: 270
      currency: EUR
      url: "https://example.com/adidas-predator-accuracy-1-kids"
      source: example.com
      sizes: ["@wanted"]
      sizes_known: true
    expected:
      band: good
      attrs: { tier: junior-flagship, soleplate: FG, silo: predator }

  - id: boots-adidas-legacy-dot-three-is-a-takedown
    note: >-
      The other direction, and the reason the read insists on the literal dot: ".3" is
      League. Cheap, and correctly refused.
    hunt: boots-junior
    product:
      title: "adidas Kids X Speedflow.3 FG"
      category: football_boots
      brand: adidas
      price: 35
      reference_price: 90
      currency: EUR
      url: "https://example.com/adidas-x-speedflow-3-kids"
      source: example.com
      sizes: ["@wanted"]
      sizes_known: true
    expected:
      band: reject
      attrs: { tier: takedown, soleplate: FG }

  - id: boots-generation-number-is-not-a-legacy-tier
    note: >-
      The trap the legacy read must never fall into. `Copa Pure 3` is a CURRENT
      generation; `.3` was a League takedown. Normalisation turns the dot into a space,
      after which the two are the same characters — so the number is only ever read as a
      tier when the dot is actually there. Getting this wrong would argue the owner out
      of exactly the boot this tool hunts.
    hunt: boots-junior
    product:
      title: "adidas Kids Copa Pure 3 Elite FG"
      category: football_boots
      brand: adidas
      price: 92
      reference_price: 250
      currency: EUR
      url: "https://example.com/adidas-copa-pure-3-elite-kids"
      source: example.com
      sizes: ["@wanted"]
      sizes_known: true
    expected:
      band: good
      attrs: { tier: junior-flagship, soleplate: FG, silo: copa, generation: "3" }
