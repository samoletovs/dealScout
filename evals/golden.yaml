# dealScout judge — golden evaluation set.
#
# Each case is a realistic product plus the band the judge SHOULD assign. Scored by
# `python -m dealscout.eval` against config.example.yaml (the profile's bands/filters).
#
# This is a DRIFT scorecard, not unit tests. tests/test_judge.py proves individual
# rules; this measures the judge's precision over a representative spread, so tuning
# regressions and improvements are visible over time. Grow it from REAL sale emails —
# especially cases the judge currently gets WRONG: label them with the CORRECT band so
# the miss shows up and drives a fix.
#
# Bands: must-buy | good | regular | reject.
# product.* maps to dealscout.models.Product (omit fields you don't need).
#
# SIZES: write `sizes: ["@wanted"]` for "a size this hunt is looking for", and
# `["@unwanted"]` for "a stated size that is not one of ours". Most cases here exist to
# pin TIER behaviour and need a stocked size only so the size gate doesn't reject them
# first — pinning the literal 37.5 meant the owner's son growing broke CI on a config
# edit that was entirely correct. Write a literal size only when the size IS the subject
# of the case. A fixture that restates a value tests a symptom; one that relates two
# things tests an invariant.

cases:
  # --- must-buy: deep discount AND under the can't-say-no price, on profile ---
  - id: boss-wool-crew-mustbuy
    note: "BOSS 100% wool crewneck at a deep summer-sale price"
    product:
      title: "BOSS wool crewneck"
      category: knitwear
      brand: BOSS
      price: 45
      reference_price: 150
      currency: EUR
      url: "https://example.com/boss-wool-crew"
      materials: { wool: 1.0 }
      care: "machine wash"
    expected: { band: must-buy }

  - id: sunspel-tee-mustbuy
    note: "Sunspel (trade-up brand) cotton tee under the tee must-buy price"
    product:
      title: "Sunspel classic tee"
      category: tee
      brand: Sunspel
      price: 18
      reference_price: 60
      currency: EUR
      url: "https://example.com/sunspel-tee"
      materials: { cotton: 1.0 }
      care: "machine wash"
    expected: { band: must-buy }

  - id: woolish-merino-mustbuy
    note: "Woolish (Baltic local -> basket tier) merino knit, steep discount"
    product:
      title: "Woolish merino sweater"
      category: knitwear
      brand: Woolish
      price: 40
      reference_price: 120
      currency: EUR
      url: "https://example.com/woolish-merino"
      materials: { merino: 1.0 }
      care: "hand wash"
    expected: { band: must-buy }

  # --- good: worth it, upper-bound price, on profile ---
  - id: lacoste-polo-good
    note: "Lacoste cotton polo — small tonal croc logo is fine (small_ok), good-band price"
    product:
