    expected: { band: good }

  # --- regular: passes the quality bar but the price isn't special -> not surfaced ---
  - id: boss-knit-regular
    note: "On-profile BOSS knit, but priced above the good band -> skip"
    product:
      title: "BOSS cotton jumper"
      category: knitwear
      brand: BOSS
