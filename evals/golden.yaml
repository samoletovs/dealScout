  - id: boss-blazer-dryclean-reject
    note: "On-profile wool blazer at a good price, but dry-clean-only -> reject"
    product:
      title: "BOSS wool blazer"
      category: jacket
      brand: BOSS
      price: 90
      reference_price: 300
      currency: EUR
      url: "https://example.com/boss-blazer"
      materials: { wool: 1.0 }
      care: "dry clean only"
    expected: { band: reject }

  - id: boss-coat-overnever-reject
    note: "Wool coat above the never-above ceiling for outerwear -> reject"
    product:
      title: "BOSS wool overcoat"
      category: outerwear
      brand: BOSS
      price: 350
      reference_price: 700
      currency: EUR
      url: "https://example.com/boss-overcoat"
      materials: { wool: 1.0 }
      care: "dry clean"
