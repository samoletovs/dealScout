# dealScout config (example). Copy to config.local.yaml (git-ignored) and edit.
# Personal data (real watch-list URLs, exact measurements) lives in the owner's private vault.
# Nothing sensitive here: sizes/preferences only — no card details, no real email.

user: sam                        # opaque id, not a real name in a shared store
notify:
  email: you@example.com         # real value comes from env (DEALSCOUT_EMAIL_TO); never commit
currency: EUR
deliver_to: LV

# Target sizes — what dealScout shops for (from the profile)
sizes:
  tee: M
  shirt_casual: M
  shirt_formal: "41"             # collar cm (16")
  knitwear: M-L
  jacket: EU50
  trousers: EU48                 # relaxed; EU46 = slimmer alternative
  shoes: EU42

# Fit differs by context
fit:
  formal: tailored               # work / customer visits
  casual: relaxed                # everyday

# Quality & logo filters (deal-breakers + scoring)
filters:
  logos: small_ok                # none | tonal_only | small_ok | any
  reject_big_wordmarks: true     # big lettering / monograms / all-over prints = hard no
  min_brand_tier: basket         # any | basket | better  — reject brands below your level
  natural_fibre_min: 0.70        # >= 70% natural (wool/cotton/linen/cashmere/silk)
  reject_materials: [polyester, acrylic]
  sportswear_synthetic_ok: true  # synthetics tolerated in true sportswear
  care_no_dry_clean_only: true   # prefer machine-wash
  quality_signals:               # score these UP
    - natural_fibre
    - substantial_weight
    - durable_make
    - easy_care
    - goodyear_welt
    - made_in_provenance

# Deal rule — exceptional bargains only (a sniper, not a firehose)
deal:
  min_discount_pct: 50           # optional: informs score/ranking, not the band
  must_buy:                      # 🟢 grab instantly (EUR)
    tee: 20
    shirt_casual: 35
    shirt_formal: 40
    knitwear: 50
    trousers: 45
    jacket: 100
    outerwear: 130
    shoes: 100
    accessory: 25
  good_offer:                    # 🟡 worth it — upper bound (EUR)
    tee: 30
    shirt_casual: 55
    shirt_formal: 65
    knitwear: 85
    trousers: 70
    jacket: 170
    outerwear: 230
    shoes: 170
    accessory: 50
  never_above:                   # ⛔ hard reject
    tee: 45
    shirt_casual: 80
    shirt_formal: 95
    knitwear: 130
    trousers: 100
    jacket: 250
    outerwear: 320
    shoes: 230
    accessory: 70

# Brand tiers (status) — accept basket-or-better, reject worse. Resolve diffusion
# lines to the sub-label (e.g. "Tommy Jeans" is worse-adjacent, not "Tommy Hilfiger").
brands:
  worse:  [H&M, Zara, "Jack & Jones", "Only & Sons", Lee, "Levi's", "Tom Tailor", "s.Oliver", Reserved, Primark, "Pull & Bear", Uniqlo]
  basket: [BOSS, "Massimo Dutti", "Ted Baker", Lacoste, "Banana Republic", Benetton, Sisley, GANT, "Tommy Hilfiger", "Polo Ralph Lauren", "Marc O'Polo", "Scotch & Soda", "Fred Perry", "Calvin Klein", COS, Arket]
  better: [Sunspel, "Luca Faloni", "A.P.C.", Asket, NN07, "Norse Projects", Sandro, "Paul Smith", "Emporio Armani", Zegna, "Loro Piana", "Brunello Cucinelli"]
  local:  [Pappus, Tines, Woolish, Sangar, GaujaGauja, Baltman, Elegants, "Amber Linen"]  # Baltic quality finds (report)

# Where to hunt bargains (ship to Latvia)
channels: [zalando-lounge.lv, booztlet, theoutnet, vinted.lv, aboutyou]

# Watch-list — specific items to track. Replace with real product URLs.
watch:
  - url: https://www.example.com/product/123
    category: knitwear
    note: "example — replace with a real product URL"

# Google Shopping scan via SerpApi (opt-in). enabled: true, but the scan stays dormant
# until the SERPAPI_KEY secret is also set — no key means scan() returns nothing. Free
# tier ~250 searches/month = one search per query per run; 6 queries ≈ 180/month. Shopping
# has no fabric data, so results are candidates (fabric verified on click).
serpapi:
  enabled: true
  country: de               # gl param — Google Shopping isn't available in the Baltics,
                            # so search a nearby supported EU market (DE: EUR, ships to LV)
  max_results: 20           # cap per query
  require_known_brand: true # only keep results whose title matches a brand tier above
  exclude_used: true        # hard-drop refurbished / pre-owned / used listings (new only)
  preferred_stores: []      # allowlist of retailers (e.g. [Zalando, "About You"]); [] = any reputable
  exclude_sources: [eBay, Amazon, AliExpress, Wish, Etsy]  # never marketplaces / individual resellers
  queries:                  # each scanned with on_sale=true — tune to taste
    - { q: "BOSS wool jumper men", category: knitwear }
    - { q: "GANT lambswool sweater men", category: knitwear }
    - { q: "Sunspel cotton t-shirt", category: tee }
    - { q: "Lacoste pique polo men", category: shirt_casual }
    - { q: "Polo Ralph Lauren oxford shirt men", category: shirt_casual }
    - { q: "Massimo Dutti wool trousers men", category: trousers }

# ---------------------------------------------------------------------------
# HUNTS — the repeatable part.
#
# A hunt is a declarative brief: what to find, for whom, and what makes it a deal.
# The engine is domain-neutral, so "Elite football boots in EU 37" and "carbon-plated
# running shoes in EU 42" are two configs over the same code. Run them with:
#
#     python -m dealscout.run_hunt              # every enabled hunt
#     python -m dealscout.run_hunt boots-junior # one hunt, even if disabled
#
# `require` gates (a stated value that doesn't match = reject). `prefer` only scores,
# ranked best-first. An attribute the page never stated is *unknown*, not failed: the
# find is still surfaced, flagged "verify on click", and capped below 🟢 must-buy.
# ---------------------------------------------------------------------------
# What each source costs to actually receive from. The shortlist ranks on price + delivery,
# not shelf price: a €45 boot from Ireland at €7 postage costs more than a €50 boot
# collected in Rīga, and sorting on the shelf price quietly recommends the wrong shop.
# A source missing from this table contributes no shipping rather than a guessed figure —
# an invented postage number would silently reorder the list.
delivery:
  prodirectsport.ie:
    label: "Pro:Direct (IE)"
    shipping: 7
    note: "ships from CZ"
  11teamsports.com:
    label: "11teamsports (DE)"
    shipping: 10
    note: "DHL 2-5 days · best-rated returns"
  komanda.lv:
    label: "komanda.lv (Rīga)"
    shipping: 0
    pickup: true
    note: "adidas official · Duntes iela 7"
  teamsport.lv:
    label: "teamsport.lv (Rīga)"
    shipping: 5
    free_over: 50
    pickup: true
    house_brand: Nike        # Nike's LV distributor: its own listings say "ZM SUPERFLY
                             # 10 ELITE SG-PRO", never "Nike", so brands_only would
                             # otherwise reject the entire shop.
    note: "Nike official LV since 1998"
  sportland.lv:
    label: "Sportland (Rīga)"
    shipping: 3
    free_over: 50
    pickup: true
    note: "~80 Baltic stores"
  futbola-apavi.lv:
    label: "futbola-apavi.lv"
    shipping: 4
  voetbalshop.nl:
    label: "Voetbalshop (NL)"
    shipping: 24.99
    # The reasoning belongs here, not in the email. `note:` is printed on every row, so it
    # has to be a fact the reader needs at a glance — not an explanation of how we know it.
    # Latvia falls under "Other - Europe" in their own rate table, read off
    # /en/customer-service/ordering on 2026-08-26. It is the dearest postage of any source
    # here, so a find must be roughly €25 better than a Baltic one to be worth it; the
    # shortlist ranks on landed cost, so it already says so without needing to explain.
    note: "dearest postage here — €25"
  futbolemotion.com:
    label: "Fútbol Emotion (ES)"
    # Deliberately no `shipping:` figure. Latvia is in their destination list, but the
    # cost is quoted per order ("according to the order's volume") and never published as
    # a rate, and an invented number would silently reorder the shortlist. Absent means
    # "unknown", which is the truth.
    note: "ships to LV, cost quoted at checkout by order volume"

hunts:
  - id: boots-junior
    enabled: true
    label: "Football boots — Elite, EU 37/37.5, under €100"
    for: junior                  # opaque household role, never a real name
    category: football_boots     # selects the vocabulary used to read titles
    deliver_to: LV
    sizes: ["37", "37.5", "37.33"]
    # A size is a brand's opinion, not a measurement. adidas sizes in thirds and prints EU
    # 37 as "37⅓" (37.33 here) — tried on and confirmed to fit. Nike's equivalent for the
    # same foot is 37.5 (Nike "5"), and Nike makes no third sizes at all. Searching both
    # lists against both brands surfaces boots that will not fit and buries ones that will.
    # `sizes` above stays as the fallback for a brand not named here.
    sizes_by_brand:
      adidas: ["37.33"]
      nike: ["37.5"]
      puma: ["37.5"]
    brands: [Nike, adidas]       # ranked — Nike scores highest
    # Puma was removed on 2026-08-25: the owner rejected the design, not the price. It is
    # the one brand whose Elite-tier boots are currently *in stock* in 37/37.5 and heavily
    # discounted (Future Ultimate FG/AG, €65 against RRP €220), so leaving it in means the
    # digest is dominated by boots that will never be bought. Add it back here to see them
    # again. Mizuno / New Balance can be appended if the shortlist should widen instead.
    brands_only: true            # and nothing else: a 79%-off Skechers is not a cheap Nike
    require:
      # Tier now comes from the catalogue in data/football_boots.yaml, not from looking
      # for the word "elite" in the title. BOTH flagships are accepted: the boots are for
      # a child, so the top of the junior range is exactly what he might buy — the point
      # of classifying is that the email can say WHICH, not that one gets filtered away.
      # A junior Elite is a different boot from an adult one (softer plate, thicker upper,
      # wider last), not the same boot in small sizes.
      #
      # NOTE: `elite` is no longer a valid value here and is not silently accepted — the
      # engine raises on an unknown require value rather than quietly matching nothing.
      tier: [adult-flagship, junior-flagship]
      soleplate: [AG, FG]              # artificial or firm ground; rejects TF/IC/SG
    require_stated: [tier]             # tier is read from the title, so an unstated tier
                                       # can never be confirmed by clicking — reject,
                                       # don't flag, or the same takedown resurfaces on
                                       # every run.
    prefer:
      soleplate: [AG, FG]              # AG scores above FG
      fit: [junior]
      # The catalogue also publishes `generation_status` (current / superseded /
      # discontinued / evergreen). Left unranked deliberately: a superseded ADULT
      # flagship at 60% off is the best find this tool can make, while an eight-year-old
      # junior boot at the same discount usually is not, so it is surfaced and labelled
      # rather than scored. Add `generation_status: [current, superseded]` to `require`
      # above to hide clearance-era stock entirely — one line, no code.
    exclude:
      models:                    # already owned — don't buy the same boot twice
        - "Legend 10 Elite"
        - "Tiempo Legend 10"
        # Retailers write the same boot in Roman numerals: Pro:Direct lists it as
        # "Nike Tiempo Legend X Elite". Without this line the owned boot resurfaces on
        # every run — and it is currently €60, so it would surface as a 🟢 must-buy.
        - "Tiempo Legend X"
      urls:
        - "https://www.sportsdirect.lv/nike-kids-legend-10-elite-firm-ground-football-boots-084181"
    price:
      must_buy: 70               # 🟢 grab instantly
      good_offer: 100            # 🟡 worth it
      never_above: 100           # ⛔ hard ceiling
      # RRP gate: proves it's the flagship, not a lookalike. 110, NOT 200 — measured, not
      # guessed. €200+ is the *adult* Elite RRP; the junior version of the same boot lists
      # at €119.95–€129.95 (adidas Predator/F50 Elite Kids, read off unisportstore.com on
      # 2026-08-25), so a 200 gate rejected every junior Elite boot in existence. 110 still
      # clears the junior League/Academy takedowns, which list at €69.95.
      # Note the gate cannot do this job alone: Nike's junior Vapor 16 *Pro* lists at
      # €139.95, above every junior Elite. The `tier` requirement is what rejects it.
      min_reference_price: 110
    watch:                       # retailer listing pages, already sorted by discount
      # sportsdirect.lv — the owner's MAIN shop, the one he actually orders from, and for
      # months the one thing this list could not read. It was recorded as unreachable
      # ("an IP-level Akamai tarpit … CI runners are datacentre IPs and will be blocked
      # too"). Measured on a runner on 2026-08-28, that was wrong in its cause: Akamai is
      # fingerprinting, not IP-blocking. A client claiming to be Chrome while its TLS
      # handshake says otherwise is tarpitted; one that honestly identifies itself is
      # served in under a second. `collector.headers_for` now sends this host an honest
      # dealScout UA, and the page yields 71 products.
      #
      # NO QUERY STRING, deliberately, and this is not the same point as the old comment
      # about #fragments. The sort DOES work as `?dcp=1&dppp=60&OrderBy=discountvalue_desc`
      # — but the shop's own robots.txt says `Disallow: *dppp` and `Disallow: *OrderBy*`,
      # so fetching it that way is scraping a page we have been asked not to. (Python's
      # RobotFileParser ignores a rule that doesn't start with "/", so nothing would have
      # stopped us — which is exactly why it has to be a decision here rather than an
      # accident there.) Nothing is lost: the bare canonical URL returns the same catalogue,
      # and this engine sorts by its own judge, not by the retailer's discount order.
      - "https://www.sportsdirect.lv/football/football-boots/kids-football-boots"
      - "https://www.sportsdirect.lv/football/football-boots"
      # Unisport (DK) — ships to LV for €7. Publishes full per-size stock AND RRP in the
      # page, so a find here can be confirmed in the size before you click.
      - "https://www.unisportstore.com/kids-boot-sale/"
      - "https://www.unisportstore.com/kids-football-boots/"
      - "https://www.unisportstore.com/discounted/football-boots-outlet/"
      # Adult ranges too: they normally start at 38.5, but some models are made in 37 and
      # that is where size 37 actually exists right now — the junior grids are sold out of
      # it. Measured 2026-08-25: nothing Elite below €114.95 has a 37 in stock.
      - "https://www.unisportstore.com/football-boots-on-sale/"
      - "https://www.unisportstore.com/ag-football-boots/"
      # Pro:Direct IE (EU store, CZ warehouse) — ships to LV.
      #
      # Runs on Shopify. Measured 2026-08-25: the HTML listing shows UK sizes (which the
      # collector correctly refuses to read as EU, so everything came back "unverified"),
      # but the Shopify products.json endpoint publishes the SAME stock in **EU** sizes
      # with a per-variant `available` flag. So read the JSON, not the page: one request
      # per collection, exact per-size stock, no link budget spent on product pages.
      - "https://www.prodirectsport.ie/collections/football-kids-boots-sale/products.json?limit=250"
      - "https://www.prodirectsport.ie/collections/football-kids-boots/products.json?limit=250"
      # Adult ranges, and this is where size 37/37.5 actually lives. The junior grids top
      # out and sell out; the adult sale carries Elite boots in 37 and 37.5 at junior
      # prices. Measured 2026-08-25: Puma Future Ultimate FG/AG, EU 37 AND 37.5 in stock,
      # €65 against an RRP of €220. The kids-only watch list could never have seen it.
      # Paged because a Shopify collection returns at most 250 products per request.
      - "https://www.prodirectsport.ie/collections/football-boots-sale/products.json?limit=250&page=1"
      - "https://www.prodirectsport.ie/collections/football-boots-sale/products.json?limit=250&page=2"
      - "https://www.prodirectsport.ie/collections/football-boots-sale/products.json?limit=250&page=3"
      - "https://www.prodirectsport.ie/collections/football-boots/products.json?limit=250&page=1"
      # komanda.lv — adidas official dealer for the Baltics, physical shop at Duntes iela 7,
      # Rīga, so a find here can be tried on before buying. Runs on Shopify: the collection
      # endpoint returns one variant per size with an availability flag, which is the
      # cleanest source in this list — one request, no scraping, exact stock.
      - "https://komanda.lv/collections/futbola-apavi/products.json?limit=250"
      - "https://komanda.lv/collections/berniem/products.json?limit=250"
      - "https://komanda.lv/collections/ag-un-tf/products.json?limit=250"
      # --- Latvia, local. Cheapest delivery, local returns, no customs. ---
      # futbola-apavi.lv — a Riga-run OpenCart football-boot specialist (~1300 SKUs; the
      # same operator also runs viskasfutbolui.lt and putsad.ee). Publishes no ld+json at
      # all, and its listing is bare image anchors, so the scout recovers names from the
      # URL slug and the price from the rendered markup. Sizes are not machine-readable
      # here, so anything it finds is capped at 🟡 "verify on click" — which is honest.
      - "https://www.futbola-apavi.lv/futbola-apavi"
      - "https://www.futbola-apavi.lv/futbola-apavi/nike"
      - "https://www.futbola-apavi.lv/futbola-apavi/adidas"
      # 11teamsports (DE) — ships to LV for €9.90 in 2-5 days. Runs Shopware, and its
      # product pages publish one ld+json Product block *per size* with an availability
      # flag, so per-size stock is exact. `serie=Elite` is a real facet, so the sale page
      # can be asked for the tier directly instead of filtering 700 boots client-side.
      - "https://www.11teamsports.com/de-de/sale/fussballschuhe/?serie=Elite"
      - "https://www.11teamsports.com/de-de/fussballschuhe/kinder-fussballschuhe/"
      # teamsport.lv — SIA VIVA SPORT, the official Nike distributor for Latvia since
      # 1998. Free shipping over €50 and Rīga pickup, so a find here can be collected in
      # person. Runs Magento and publishes no ld+json; its *product* pages load the price
      # over AJAX, so a product page states no price at all — but the category renders
      # every tile server-side with name, link and price, which is what the scout reads.
      # One request covers the whole boots category (48 products, 34 of them Elite;
      # paging parameters are ignored, so asking for page 2 just re-fetches page 1).
      # Tiles state no sizes, so everything here is capped at 🟡 "verify on click".
      - "https://www.teamsport.lv/lv_lv/futbols/futbola-apavi.html"
      # voetbalshop.nl (NL) — a large Dutch specialist carrying the full flagship range.
      # Magento, like teamsport.lv, but a different theme: no ld+json anywhere, and none
      # of teamsport's `data-price-amount` markup, so the generalised tile reader is what
      # sees it. Unusually for a listing, each tile also renders a size swatch that links
      # only the sizes actually purchasable — so this is one of the few sources giving
      # exact per-size stock *without* a request per product. Measured 2026-08-26: 48
      # products per page, 34 with exact stock, adidas F50 Hyperfast Elite €223.99 (RRP
      # €279.99). Paging parameters are ignored exactly as on teamsport.lv, so breadth
      # comes from separate category URLs rather than page numbers.
      # Postage to LV is €24.99 — by far the dearest here, hence the delivery entry above.
      - "https://www.voetbalshop.nl/en/outlet/football-boots.html"
      - "https://www.voetbalshop.nl/en/kids/football-boots.html"
      - "https://www.voetbalshop.nl/en/adidas/football-boots.html"
      - "https://www.voetbalshop.nl/en/nike/football-boots.html"
      # futbolemotion.com (ES) — Spain's largest football specialist, ~30k products, and
      # the best source of colourways that never reach the Baltics. Its listing publishes
      # ld+json for every product, so price needs no scraping; per-size stock does not
      # appear in the HTML at all (the size table is filled in by a separate API call),
      # so everything here is capped at 🟡 "verify on click" — which is honest.
      # Like komanda.lv it publishes no "was" price, so judge it on absolute price rather
      # than discount. Brand-specific URLs, because the hunt is brands_only.
      - "https://www.futbolemotion.com/en/outlet/football-boots"
      - "https://www.futbolemotion.com/en/category/soccer-boots/nike"
      - "https://www.futbolemotion.com/en/category/soccer-boots/adidas"
    catalogs:
      # sportland.lv — Baltic's largest sports chain (~80 stores, official Nike Baltic
      # distributor), so a find here can be tried on before buying. The site is a
      # ScandiPWA shell: no ld+json, no price, no tiles, nothing a parser can read, which
      # looked like it needed a headless browser. It does not. ScandiPWA is a React front
      # end *for Magento 2*, so the same data arrives over Magento's GraphQL endpoint —
      # public by design, unlike the REST API that guards the same catalogue behind a
      # token. This reads the shop exactly the way its own front end does.
      #
      # GraphQL here accepts only url_key/category filters and no free-text search, so the
      # sitemap does discovery: 18,616 products, filtered to a few dozen on the slug
      # before any request is spent. Take the sitemap named in robots.txt — the default
      # /sitemap.xml belongs to a different storefront of the same group.
      #
      # Sizes are NOT read: a variant carries a stock flag but no attributes, so which
      # size is in stock cannot be established, and everything here stays 🟡 verify-on-click.
      - sitemap: "https://sportland.lv/media/sitemap_LV.xml"
        graphql: "https://sportland.lv/graphql"
        origin: "https://sportland.lv"
        match: "boots|cleats"
    queries:                     # SerpApi (dormant without SERPAPI_KEY) — costs 1 search each
      - "Nike Mercurial Superfly 10 Elite junior AG"
      - "Nike Mercurial Vapor 16 Elite junior football boots"
      - "Nike Phantom Elite junior football boots"
      - "adidas Predator Elite junior AG football boots"
      - "adidas F50 Elite junior football boots"
      - "Puma Future Ultimate junior football boots"
    notes: "Under €100 · junior Elite RRP €120+ · AG preferred, FG accepted · ships to Latvia"

  # A second hunt proves the engine is not boots-specific. Disabled until needed.
  - id: running-adult
    enabled: false
    label: "Running shoes — race-day plated, EU 42"
    for: sam
    category: running_shoes
    deliver_to: LV
    sizes: ["42", "42.5"]
    brands: [Nike, adidas, Saucony, Hoka, Asics, Puma]
    require:
      # No catalogue file exists for running_shoes, so tier here still comes from the
      # vocabulary (elite | mid | entry). Proof the catalogue is category-scoped: adding
      # data/running_shoes.yaml would change this line, and nothing in the engine.
      tier: [elite]
    prefer:
      plate: [carbon]
      surface: [road]
    price:
      must_buy: 120
      good_offer: 180
      never_above: 200
      min_reference_price: 220
    queries:
      - "Nike Vaporfly 3 sale"
      - "adidas Adizero Adios Pro 4 sale"
      - "Saucony Endorphin Elite sale"
    notes: "Race-day only — carbon plate, road"

# Monitor — memory between runs, so a cron reports news instead of repeating itself.
monitor:
  state_path: state/hunts.json
  min_drop_pct: 5              # re-alert on a product already seen once it drops this much
  forget_after_days: 90        # a product gone this long is genuinely news if it returns
  # Price memory — what each product has *actually* sold for, so the email can say
  # "cheapest seen in 45 days" instead of trusting the retailer's own "was" price.
  price_history_path: state/prices.jsonl
  price_history_days: 180      # observations older than this are pruned
  price_history_max_points: 200 # ...and no more than this many per product, newest kept
  # The floor below which the honest answer is "not enough history yet" and the email
  # says nothing at all. Two sightings an hour apart cannot tell a real low from the only
  # two numbers we happen to have, and claiming otherwise is worse than staying quiet.
  price_min_observations: 3
  price_min_span_days: 7

# Politeness when reading watch pages (respect robots/ToS; prefer feeds).
scrape:
  delay_seconds: 1.0
  max_confirmations: 25        # product pages one hunt may open to confirm size + RRP
  link_budget: 30              # product pages a single link-only listing may cost us
  # Sources a second request cannot resolve — documented in SOURCES.md from investigation,
  # not guessed from a quiet run. Both serve the same ld+json on the product page as on the
  # listing and fill per-size stock from a separate API the page never carries, so
  # re-fetching a boot from here learns neither a size nor a new RRP (measured
  # futbolemotion.com=0/7 a run). The shortlist does not spend a confirmation slot on them;
  # their boots stay honestly unresolved in "❔ Size not published". This is season-scale
  # knowledge and can rot: the run WARNS if one ever returns a size, so re-check this list
  # and SOURCES.md rather than trusting it forever. Verified 2026-08-27.
  size_unreadable_sources:
    - futbolemotion.com        # size table is "Loading…" placeholders; product page == listing
    - sportland.lv             # ScandiPWA/Magento2; per-size stock not reachable by the GraphQL path we currently use — may be a different field, worth a look
  # RRP memory: an RRP is a manufacturer list price and moves at a season boundary, so a
  # boot confirmed before need not spend a slot re-learning it. Stock is NEVER cached (sizes
  # sell out between runs); only the RRP is, and only where the listing gave none — a live
  # RRP always wins. Entries expire after rrp_cache_days so a re-priced or retired boot's
  # number cannot live forever.
  rrp_cache_path: state/rrp.json
  rrp_cache_days: 180

