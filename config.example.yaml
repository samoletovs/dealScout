# dealScout config (example). Copy to config.local.yaml (git-ignored) and edit.
# Personal data (real watch-list URLs, exact measurements) lives in the owner's private vault.
# Nothing sensitive here: sizes/preferences only — no card details, no real email.

user: sam                        # opaque id, not a real name in a shared store
notify:
  email: you@example.com         # real value comes from env (DEALSCOUT_EMAIL_TO); never commit
currency: EUR
deliver_to: LV

# Target sizes — what dealScout shops for (from the profile)
sizes:
  tee: M
  shirt_casual: M
  shirt_formal: "41"             # collar cm (16")
  knitwear: M-L
  jacket: EU50
  trousers: EU48                 # relaxed; EU46 = slimmer alternative
  shoes: EU42

# Fit differs by context
fit:
  formal: tailored               # work / customer visits
  casual: relaxed                # everyday

# Quality & logo filters (deal-breakers + scoring)
filters:
  logos: small_ok                # none | tonal_only | small_ok | any
  reject_big_wordmarks: true     # big lettering / monograms / all-over prints = hard no
  min_brand_tier: basket         # any | basket | better  — reject brands below your level
  natural_fibre_min: 0.70        # >= 70% natural (wool/cotton/linen/cashmere/silk)
  reject_materials: [polyester, acrylic]
  sportswear_synthetic_ok: true  # synthetics tolerated in true sportswear
  care_no_dry_clean_only: true   # prefer machine-wash
  quality_signals:               # score these UP
    - natural_fibre
    - substantial_weight
    - durable_make
    - easy_care
    - goodyear_welt
    - made_in_provenance

# Deal rule — exceptional bargains only (a sniper, not a firehose)
deal:
  min_discount_pct: 50           # optional: informs score/ranking, not the band
  must_buy:                      # 🟢 grab instantly (EUR)
    tee: 20
    shirt_casual: 35
    shirt_formal: 40
    knitwear: 50
    trousers: 45
    jacket: 100
    outerwear: 130
    shoes: 100
    accessory: 25
  good_offer:                    # 🟡 worth it — upper bound (EUR)
    tee: 30
    shirt_casual: 55
    shirt_formal: 65
    knitwear: 85
    trousers: 70
    jacket: 170
    outerwear: 230
    shoes: 170
    accessory: 50
  never_above:                   # ⛔ hard reject
    tee: 45
    shirt_casual: 80
    shirt_formal: 95
    knitwear: 130
    trousers: 100
    jacket: 250
    outerwear: 320
    shoes: 230
    accessory: 70

# Brand tiers (status) — accept basket-or-better, reject worse. Resolve diffusion
# lines to the sub-label (e.g. "Tommy Jeans" is worse-adjacent, not "Tommy Hilfiger").
brands:
  worse:  [H&M, Zara, "Jack & Jones", "Only & Sons", Lee, "Levi's", "Tom Tailor", "s.Oliver", Reserved, Primark, "Pull & Bear", Uniqlo]
  basket: [BOSS, "Massimo Dutti", "Ted Baker", Lacoste, "Banana Republic", Benetton, Sisley, GANT, "Tommy Hilfiger", "Polo Ralph Lauren", "Marc O'Polo", "Scotch & Soda", "Fred Perry", "Calvin Klein", COS, Arket]
  better: [Sunspel, "Luca Faloni", "A.P.C.", Asket, NN07, "Norse Projects", Sandro, "Paul Smith", "Emporio Armani", Zegna, "Loro Piana", "Brunello Cucinelli"]
  local:  [Pappus, Tines, Woolish, Sangar, GaujaGauja, Baltman, Elegants, "Amber Linen"]  # Baltic quality finds (report)

# Where to hunt bargains (ship to Latvia)
channels: [zalando-lounge.lv, booztlet, theoutnet, vinted.lv, aboutyou]

# Watch-list — specific items to track. Replace with real product URLs.
watch:
  - url: https://www.example.com/product/123
    category: knitwear
    note: "example — replace with a real product URL"

# Google Shopping scan via SerpApi (opt-in). enabled: true, but the scan stays dormant
# until the SERPAPI_KEY secret is also set — no key means scan() returns nothing. Free
# tier ~250 searches/month = one search per query per run; 6 queries ≈ 180/month. Shopping
# has no fabric data, so results are candidates (fabric verified on click).
serpapi:
  enabled: true
  country: de               # gl param — Google Shopping isn't available in the Baltics,
                            # so search a nearby supported EU market (DE: EUR, ships to LV)
  max_results: 20           # cap per query
  require_known_brand: true # only keep results whose title matches a brand tier above
  exclude_used: true        # hard-drop refurbished / pre-owned / used listings (new only)
  preferred_stores: []      # allowlist of retailers (e.g. [Zalando, "About You"]); [] = any reputable
  exclude_sources: [eBay, Amazon, AliExpress, Wish, Etsy]  # never marketplaces / individual resellers
  queries:                  # each scanned with on_sale=true — tune to taste
    - { q: "BOSS wool jumper men", category: knitwear }
    - { q: "GANT lambswool sweater men", category: knitwear }
    - { q: "Sunspel cotton t-shirt", category: tee }
    - { q: "Lacoste pique polo men", category: shirt_casual }
    - { q: "Polo Ralph Lauren oxford shirt men", category: shirt_casual }
    - { q: "Massimo Dutti wool trousers men", category: trousers }

# ---------------------------------------------------------------------------
# HUNTS — the repeatable part.
#
# A hunt is a declarative brief: what to find, for whom, and what makes it a deal.
# The engine is domain-neutral, so "Elite football boots in EU 37" and "carbon-plated
# running shoes in EU 42" are two configs over the same code. Run them with:
#
#     python -m dealscout.run_hunt              # every enabled hunt
#     python -m dealscout.run_hunt boots-junior # one hunt, even if disabled
#
# `require` gates (a stated value that doesn't match = reject). `prefer` only scores,
# ranked best-first. An attribute the page never stated is *unknown*, not failed: the
# find is still surfaced, flagged "verify on click", and capped below 🟢 must-buy.
# ---------------------------------------------------------------------------
hunts:
  - id: boots-junior
    enabled: true
    label: "Football boots — Elite, EU 37/37.5, under €100"
    for: junior                  # opaque household role, never a real name
    category: football_boots     # selects the vocabulary used to read titles
    deliver_to: LV
    sizes: ["37", "37.5"]
    brands: [Nike, adidas, Puma] # ranked — Nike scores highest, Puma lowest
    require:
      tier: [elite]              # the athlete boot only; rejects Academy/Club/League/Pro
      soleplate: [AG, FG]        # artificial or firm ground; rejects TF/IC/SG
    prefer:
      soleplate: [AG, FG]        # AG scores above FG
      fit: [junior]
    exclude:
      models:                    # already owned — don't buy the same boot twice
        - "Legend 10 Elite"
        - "Tiempo Legend 10"
      urls:
        - "https://www.sportsdirect.lv/nike-kids-legend-10-elite-firm-ground-football-boots-084181"
    price:
      must_buy: 70               # 🟢 grab instantly
      good_offer: 100            # 🟡 worth it
      never_above: 100           # ⛔ hard ceiling
      # RRP gate: proves it's the flagship, not a lookalike. 110, NOT 200 — measured, not
      # guessed. €200+ is the *adult* Elite RRP; the junior version of the same boot lists
      # at €119.95–€129.95 (adidas Predator/F50 Elite Kids, read off unisportstore.com on
      # 2026-08-25), so a 200 gate rejected every junior Elite boot in existence. 110 still
      # clears the junior League/Academy takedowns, which list at €69.95.
      # Note the gate cannot do this job alone: Nike's junior Vapor 16 *Pro* lists at
      # €139.95, above every junior Elite. The `tier` requirement is what rejects it.
      min_reference_price: 110
    watch:                       # retailer listing pages, already sorted by discount
      # Known-good, previously bought from. Behind Akamai bot protection: it answers a
      # complete browser header set and silently tarpits anything less, so keep the
      # request rate low — see collector.BROWSER_HEADERS.
      - "https://www.sportsdirect.lv/football/football-boots/kids-football-boots#dcp=1&dppp=60&OrderBy=discountvalue_desc"
      # Unisport (DK) — ships to LV for €7. Publishes full per-size stock AND RRP in the
      # page, so a find here can be confirmed in the size before you click.
      - "https://www.unisportstore.com/kids-boot-sale/"
      - "https://www.unisportstore.com/kids-football-boots/"
      - "https://www.unisportstore.com/discounted/football-boots-outlet/"
      # Pro:Direct IE (EU store, CZ warehouse) — ships to LV. Its listings carry links
      # only, so the scout reads the product pages of plausible titles. Deliberately NOT
      # sorted price-ascending: that returns the 50 cheapest, which are always takedown
      # models, and the Elite boots never appear in the list at all. Sizes there are UK,
      # which the collector reports as unknown rather than mis-reading as EU.
      - "https://www.prodirectsport.ie/collections/football-kids-boots-sale"
    queries:                     # SerpApi (dormant without SERPAPI_KEY) — costs 1 search each
      - "Nike Mercurial Superfly 10 Elite junior AG"
      - "Nike Mercurial Vapor 16 Elite junior football boots"
      - "Nike Phantom Elite junior football boots"
      - "adidas Predator Elite junior AG football boots"
      - "adidas F50 Elite junior football boots"
      - "Puma Future Ultimate junior football boots"
    notes: "Under €100 · junior Elite RRP €120+ · AG preferred, FG accepted · ships to Latvia"

  # A second hunt proves the engine is not boots-specific. Disabled until needed.
  - id: running-adult
    enabled: false
    label: "Running shoes — race-day plated, EU 42"
    for: sam
    category: running_shoes
    deliver_to: LV
    sizes: ["42", "42.5"]
    brands: [Nike, adidas, Saucony, Hoka, Asics, Puma]
    require:
      tier: [elite]
    prefer:
      plate: [carbon]
      surface: [road]
    price:
      must_buy: 120
      good_offer: 180
      never_above: 200
      min_reference_price: 220
    queries:
      - "Nike Vaporfly 3 sale"
      - "adidas Adizero Adios Pro 4 sale"
      - "Saucony Endorphin Elite sale"
    notes: "Race-day only — carbon plate, road"

# Monitor — memory between runs, so a cron reports news instead of repeating itself.
monitor:
  state_path: state/hunts.json
  min_drop_pct: 5              # re-alert on a product already seen once it drops this much
  forget_after_days: 90        # a product gone this long is genuinely news if it returns

# Politeness when reading watch pages (respect robots/ToS; prefer feeds).
scrape:
  delay_seconds: 1.0
  max_confirmations: 25        # product pages one hunt may open to confirm size + RRP
  link_budget: 12              # product pages a single link-only listing may cost us

# Vocabulary overrides — teach the extractor new words without a code change.
# Shape: category -> attribute -> value -> [patterns]. A value listed here REPLACES
# the built-in for that attribute (see dealscout/spec.py DEFAULT_VOCAB).
# vocab:
#   football_boots:
#     tier:
#       elite: [elite, ultimate, premium, "made in japan"]
